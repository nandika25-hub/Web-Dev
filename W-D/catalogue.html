<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalogue</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-shell">
        <h2 style="text-align:center; color: var(--primary-strong);">Book Catalogue</h2>

        <div class="table-wrap">
            <table>
                <tr>
                    <th>Book Cover</th>
                    <th>Book Name</th>
                    <th>Author Name</th>
                    <th>Publisher</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>

                <tr>
                    <td><img src="https://m.media-amazon.com/images/I/91VXcW8kLRL._SL1500_.jpg" alt="Concrete Technology" width="100"></td>
                    <td>Concrete Technology</td>
                    <td>M.S. Shetty & A.K. Jain</td>
                    <td>S.Chand</td>
                    <td>₹299</td>
                    <td><button class="action-btn">Add to Cart</button></td>
                </tr>

                <tr>
                    <td><img src="https://baazimagess3.s3-ap-southeast-1.amazonaws.com/product_media/9788177588262/md_9788177588262.jpg" alt="Data Structures" width="100"></td>
                    <td>Data Structures</td>
                    <td>Alfred, John, Jeffrey</td>
                    <td>Pearson</td>
                    <td>₹550</td>
                    <td><button class="action-btn">Add to Cart</button></td>
                </tr>

                <tr>
                    <td><img src="https://m.media-amazon.com/images/I/511OqY2Wt2L.jpg" alt="Digital Logic" width="100"></td>
                    <td>Digital Logic</td>
                    <td>Sonali Singh</td>
                    <td>BPB</td>
                    <td>₹299</td>
                    <td><button class="action-btn">Add to Cart</button></td>
                </tr>

                <tr>
                    <td><img src="https://d16jkos453if22.cloudfront.net/9780123850591.jpg" alt="Network and System" width="100"></td>
                    <td>Network and System</td>
                    <td>Larry L.P and Bruce S.D</td>
                    <td>M.K</td>
                    <td>₹399</td>
                    <td><button class="action-btn">Add to Cart</button></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
