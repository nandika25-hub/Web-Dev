<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Online Book Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-shell">
        <h2 style="text-align:center; color: var(--primary-strong);">My Shopping Cart</h2>

        <div class="table-wrap">
            <table>
                <tr>
                    <th>Book Cover</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Publisher</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>

                <tr>
                    <td><img src="https://cb2.scene7.com/is/image/CB2/ModArchtAZCoffeeTblBookHSHF23/$web_pdp_main_carousel_md$/230720101408/modern-architecture-a-z-coffee-table-book.jpg" alt="Architecture" width="100"></td>
                    <td>Architecture</td>
                    <td>Aurelia & Cytaschen</td>
                    <td>Taschen</td>
                    <td>₹550</td>
                    <td><input type="number" value="1" min="1" style="width: 70px; text-align:center;"></td>
                    <td>₹550</td>
                    <td><button class="secondary-btn">Remove</button></td>
                </tr>

                <tr>
                    <td><img src="https://m.media-amazon.com/images/I/91VXcW8kLRL._SL1500_.jpg" alt="Concrete Technology" width="100"></td>
                    <td>Concrete Technology</td>
                    <td>M.S. Shetty & A.K. Jain</td>
                    <td>S.Chand</td>
                    <td>₹299</td>
                    <td><input type="number" value="1" min="1" style="width: 70px; text-align:center;"></td>
                    <td>₹299</td>
                    <td><button class="secondary-btn">Remove</button></td>
                </tr>
            </table>
        </div>

        <div class="cart-summary">
            <div class="summary-box"><h3>Subtotal</h3><strong>₹849</strong></div>
            <div class="summary-box"><h3>Delivery</h3><strong>₹50</strong></div>
            <div class="summary-box"><h3>Total</h3><strong>₹899</strong></div>
        </div>

        <div class="form-actions" style="margin-top: 26px;">
            <a href="catalogue.html" class="secondary-btn">Continue Shopping</a>
            <button class="form-btn">Proceed to Checkout</button>
        </div>
    </div>
</body>
</html>
